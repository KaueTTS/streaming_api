services:
  api:
    build: .
    container_name: streaming-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: streaming-api-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    container_name: streaming-api-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    
volumes:
  redis_data: 